# preflight.conf — what `bin/preflight.sh` builds and tests for THIS app.
#
# Sourced by preflight.sh. One CHECK per line:  "label | scheme | dest | action"
#   dest    : macos | ios-sim | ios-generic | watch-generic | <full -destination>
#   action  : test (build + run tests)  |  build (compile only)

APP_NAME="Wellkept"

# macOS only, and `test` rather than `build` on purpose. The scheme in project.yml is declared by
# hand precisely so this line runs something: an XcodeGen auto-generated scheme builds the app
# alone and reports success, which is how Lode shipped nineteen "gated" builds that never executed
# a test.
CHECKS=(
  "macOS | Wellkept | macos | test"
)

# The shared vocabulary lives in a local SwiftPM package, and the app scheme's Test action does NOT
# run a package's own test target — only WellkeptTests. `swift test --package-path Core` does.
# Without this line, Core/Tests/WellkeptCoreTests would compile in nobody's build and run in
# nobody's gate.
SWIFT_PACKAGES=(Core)

# Wellkept's test bundle is a logic bundle with no TEST_HOST, so the unsigned path is correct and
# fast. Set to 1 only if the tests are ever hosted by the real app AND its startup touches
# something entitlement-gated — and if that day comes, the app must also make itself inert under
# XCTest, or the gate becomes a real launch that reads the user's real disk.
TEST_NEEDS_SIGNING=0

BACKENDS=()
